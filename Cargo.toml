[package]
name = "svc-gitconfig-proxy"
version = "0.2.0"
edition = "2021"
description = "Lightweight GitHub API proxy for DayZ Survivatorium-GitConfig mod"
license = "MIT"

[dependencies]
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
strip = true
lto = true
opt-level = "z"
